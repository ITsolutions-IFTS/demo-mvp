<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ARStudio — Ver en tu espacio</title>

  <!--
    model-viewer v3.4 — Google
    Detecta superficies automáticamente, sin marcador:
      · Android con ARCore  → WebXR Hit Testing (en el navegador, apuntás al piso/mesa)
      · Android sin ARCore  → Scene Viewer (app nativa de Google AR)
      · iOS Safari          → Quick Look (AR nativa de Apple)
    Docs: https://modelviewer.dev
  -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* ─── MODEL VIEWER fullscreen ─── */
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: #0a0a0a;
      background-color: #111;
    }

    /* ─── HEADER ─── */
    .ar-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem;
      pointer-events: none;
    }
    .ar-logo {
      font-size: 1rem; font-weight: 700; color: #fff;
      letter-spacing: -0.02em; text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    }
    .ar-logo span { color: #c8ff3e; }
    .ar-back {
      pointer-events: all;
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; font-size: 0.8rem; padding: 0.45rem 0.9rem;
      border-radius: 2rem; text-decoration: none; backdrop-filter: blur(8px);
    }

    /* ─── BOTÓN "Ver en tu espacio" — sloteado dentro de model-viewer ─── */
    .btn-ar {
      background: #c8ff3e; color: #0a0a0a;
      font-weight: 700; font-size: 0.9rem;
      padding: 0.85rem 2rem; border: none; border-radius: 2rem;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 4px 20px rgba(200,255,62,0.4);
      display: flex; align-items: center; gap: 0.5rem;
    }

    /* ─── BADGE sin AR ─── */
    #no-ar-badge {
      display: none;
      position: fixed; top: 5.5rem; left: 50%; transform: translateX(-50%);
      background: rgba(255,107,53,0.1); border: 1px solid rgba(255,107,53,0.3);
      color: rgba(255,200,150,0.9); font-size: 0.75rem;
      padding: 0.5rem 1rem; border-radius: 2rem; z-index: 100;
      white-space: nowrap;
    }

    /* ─── PANEL PRODUCTO ─── */
    .product-panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px 20px 0 0;
      padding: 1.25rem 1.5rem 2.5rem;
      backdrop-filter: blur(16px);
    }
    .product-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; margin-bottom: 1rem;
    }
    .product-name { color: #fff; font-size: 1.1rem; font-weight: 600; line-height: 1.2; }
    .product-desc { color: rgba(255,255,255,0.55); font-size: 0.8rem; margin-top: 4px; line-height: 1.5; }
    .product-price {
      color: #c8ff3e; font-size: 1.4rem; font-weight: 700;
      white-space: nowrap; text-shadow: 0 0 20px rgba(200,255,62,0.4);
    }
    .product-actions { display: flex; gap: 0.75rem; }
    .btn-buy {
      flex: 1; background: #c8ff3e; color: #0a0a0a;
      font-weight: 700; font-size: 0.875rem;
      border: none; border-radius: 12px; padding: 0.8rem; cursor: pointer;
    }
    .btn-buy:active { filter: brightness(0.88); }
    .btn-share {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.1); color: #fff;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
      cursor: pointer; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
    }

    /* ─── TOAST ─── */
    #toast {
      position: fixed; bottom: 11rem; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(10,10,10,0.9); color: #fff;
      padding: 0.6rem 1.2rem; border-radius: 2rem;
      font-size: 0.82rem; z-index: 200;
      opacity: 0; transition: opacity 0.3s, transform 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="ar-header">
    <div class="ar-logo">AR<span>Studio</span></div>
    <a class="ar-back" href="/">← Volver</a>
  </header>

  <div id="no-ar-badge">AR no disponible — podés rotar el modelo con los dedos</div>

  <!--
    src="./modelo.glb"  → tu modelo 3D (descargalo de poly.pizza o sketchfab y renombralo)
    Si modelo.glb no existe el script de abajo carga un modelo de demostración.

    ar-modes en orden de preferencia:
      webxr       → Chrome Android + ARCore: detección de superficie en el navegador
      scene-viewer→ Android sin ARCore: abre la app Scene Viewer de Google
      quick-look  → iOS Safari: abre Quick Look de Apple

    ar-scale="fixed" → el objeto mantiene su escala real al colocarlo en el espacio
  -->
  <model-viewer
    id="mv"
    src="./modelo.glb"
    alt="Producto en realidad aumentada"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="800"
    rotation-per-second="25deg"
    shadow-intensity="1"
    shadow-softness="0.8"
    environment-image="neutral"
    exposure="1"
    style="width:100%;height:100%;"
  >
    <!--
      Este botón aparece sobre el visor 3D.
      Al tocarlo lanza la experiencia AR de superficie:
        · En Android abre la cámara con detección de piso/mesa
        · En iOS abre Quick Look con el modelo listo para colocar
    -->
    <button slot="ar-button" class="btn-ar" id="ar-btn">
      📱 Ver en tu espacio
    </button>
  </model-viewer>

  <div class="product-panel">
    <div class="product-top">
      <div>
        <div class="product-name" id="product-name">Silla Eames Replica</div>
        <div class="product-desc" id="product-desc">Madera de nogal · Cuero genuino</div>
      </div>
      <div class="product-price" id="product-price">$189.990</div>
    </div>
    <div class="product-actions">
      <button class="btn-buy" onclick="handleBuy(this)">Agregar al carrito</button>
      <button class="btn-share" onclick="handleShare()" title="Compartir">↑</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const mv = document.getElementById('mv');

    // ─── Fallback si modelo.glb no existe ───────────────────────────────
    // model-viewer dispara 'error' si no puede cargar el src.
    // Cargamos un modelo de demo de Google hasta que tengan su propio .glb.
    // Modelos gratuitos para reemplazarlo: https://poly.pizza  https://sketchfab.com
    mv.addEventListener('error', () => {
      if (!mv.src.includes('modelviewer.dev')) {
        mv.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
        document.getElementById('product-name').textContent = 'Modelo de demostración';
        document.getElementById('product-desc').textContent = 'Agregá modelo.glb para usar tu propio producto';
        showToast('Sin modelo.glb — cargando demo');
      }
    });

    // ─── Detectar soporte AR ─────────────────────────────────────────────
    mv.addEventListener('load', () => {
      if (!mv.canActivateAR) {
        document.getElementById('no-ar-badge').style.display = 'block';
        document.getElementById('ar-btn').style.display = 'none';
      }
    });

    // ─── Agregar al carrito ──────────────────────────────────────────────
    function handleBuy(btn) {
      showToast('✓ Agregado al carrito');
      btn.textContent = '¡Agregado! ✓';
      btn.style.background = '#a8e600';
      setTimeout(() => {
        btn.textContent = 'Agregar al carrito';
        btn.style.background = '';
      }, 2000);
    }

    // ─── Compartir ───────────────────────────────────────────────────────
    function handleShare() {
      if (navigator.share) {
        navigator.share({
          title: 'ARStudio — Ver producto en AR',
          text: '¡Mirá este producto en realidad aumentada!',
          url: window.location.href,
        }).catch(() => {});
      } else {
        navigator.clipboard?.writeText(window.location.href)
          .then(() => showToast('Link copiado al portapapeles'))
          .catch(() => showToast('Compartí: ' + window.location.href));
      }
    }

    // ─── Toast ───────────────────────────────────────────────────────────
    function showToast(msg, duration = 2500) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }
  </script>
</body>
</html>
